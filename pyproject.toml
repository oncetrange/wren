[project]
name = "wren"
version = "0.1.0"
description = "A coding agent for the terminal"
authors = [
    { name = "oncetrange", email = "oncetrange@outlook.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.8.0",
    "openai>=3.19.2",
    "prompt-toolkit>=3.0.53",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
]

[project.scripts]
wren = "wren.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["deep-swe", "jobs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    "E501",   # long lines are judged in review, not by a hard limit
    "E701",   # one-line protocol-style methods (def f(self) -> None: ...)
    "E702",
    "E741",   # `l` in short comprehensions
]

[tool.ruff.lint.isort]
known-first-party = ["wren"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.12"
typeCheckingMode = "basic"

[project]
# The PyPI name; the command is `wren` and the import package `wren`.
name = "wren-agent"
dynamic = ["version"]
description = "A coding agent for the terminal"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "oncetrange", email = "oncetrange@outlook.com" }
]
keywords = ["coding agent", "llm", "cli", "anthropic", "openai", "mcp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.8.0",
    "mcp>=2.2.0",
    "openai>=3.19.2",
    "prompt-toolkit>=3.0.53",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
]

[project.urls]
Homepage = "https://github.com/oncetrange/wren"
Repository = "https://github.com/oncetrange/wren"
Issues = "https://github.com/oncetrange/wren/issues"

[project.scripts]
wren = "wren.cli.main:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/wren/__init__.py"  # the one place the version is written

[tool.hatch.build.targets.wheel]
packages = ["src/wren"]  # not found by name: the project is wren-agent

[tool.hatch.build.targets.sdist]
exclude = [".wren", ".github", "uv.lock", "examples"]

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["deep-swe", "jobs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    "E501",   # long lines are judged in review, not by a hard limit
    "E701",   # one-line protocol-style methods (def f(self) -> None: ...)
    "E702",
    "E741",   # `l` in short comprehensions
]

[tool.ruff.lint.isort]
known-first-party = ["wren"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.12"
typeCheckingMode = "basic"
